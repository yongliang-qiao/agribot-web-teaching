<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriBot · 教师管理后台（本地服务）</title><style>*{box-sizing:border-box}body{font:14px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif;background:#081c20;color:#e7f5ee;margin:0}header{padding:22px 5%;background:#11302f;border-bottom:1px solid #315a52}h1{font-size:24px;margin:0}main{padding:20px 5%;display:grid;gap:16px;grid-template-columns:320px 1fr}.panel{background:#12302f;border:1px solid #335a53;padding:18px;border-radius:13px}input,button,select{padding:11px;margin:5px 0 10px;background:#081c1d;color:#e7f5ee;border:1px solid #427365;border-radius:6px;font:inherit;max-width:100%}input{width:100%}button{background:#22624c;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px;overflow:auto}td,th{border-bottom:1px solid #45665c;padding:10px;text-align:left}small{color:#a6c6b9}#msg{white-space:pre-wrap;color:#f7d99f}a{color:#b8ecca}@media(max-width:850px){main{grid-template-columns:1fr}}</style></head><body>
<header><h1>AgriBot · 教师管理后台</h1><small>仅供教学演示 · SQLite 本地服务器 · 学生登记、班级、成绩汇总</small></header>
<main><aside><section class="panel"><h3>教师令牌</h3><input id="token" type="password" placeholder="AGRIBOT_ADMIN_TOKEN"><button id="connect">连接后台并刷新</button><div id="msg">此页面需要启动 python server/server.py，GitHub Pages 静态站点无法提供教师数据库。</div></section>
<section class="panel"><h3>创建班级</h3><input id="className" placeholder="如：农业机器人技术 2026 秋"><button id="newClass">创建班级 + 加入码</button><h3>登记学生</h3><select id="whichClass"></select><input id="studentId" placeholder="学号（应与学生实验页面一致）"><input id="studentName" placeholder="学生姓名"><button id="addStudent">登记</button></section></aside>
<article style="display:grid;gap:16px"><section class="panel"><h3>班级汇总</h3><table><thead><tr><th>班级</th><th>加入码</th><th>人数</th><th>成绩数</th><th>平均分</th></tr></thead><tbody id="stats"></tbody></table></section>
<section class="panel"><h3>学生名单 / 提交成绩</h3><label>选择班级</label> <select id="filter"></select> <button id="refresh">刷新</button> <button id="export">导出成绩 CSV</button><h4>学生名单</h4><table><thead><tr><th>学号</th><th>姓名</th></tr></thead><tbody id="roster"></tbody></table><h4>实验成绩</h4><table><thead><tr><th>学号</th><th>实验</th><th>场景种子</th><th>成绩</th><th>提交时间</th></tr></thead><tbody id="grades"></tbody></table></section></article></main>
<script>
const $=id=>document.getElementById(id);let token='',classes=[],submissions=[];const msg=t=>$('msg').textContent=t;
async function api(path,method='GET',obj){const r=await fetch('/api/'+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:obj?JSON.stringify(obj):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);return data}
function renderTable(id,rows){$(id).replaceChildren();for(const vals of rows){const tr=document.createElement('tr');for(const v of vals){const td=document.createElement('td');td.textContent=v??'—';tr.append(td)}$(id).append(tr)}}
async function load(){const c=await api('classes'),s=await api('stats');classes=c.classes;renderTable('stats',s.stats.map(x=>[x.name,x.code,x.students,x.submissions,x.avg_score]));for(const id of ['whichClass','filter']){const before=$(id).value;$(id).replaceChildren();for(const a of classes){const opt=document.createElement('option');opt.value=a.id;opt.textContent=a.name;$(id).append(opt)}if([...$(id).options].some(x=>x.value===before))$(id).value=before;}await readClass();msg('已连接教师后台，共 '+classes.length+' 个班级。')}
async function readClass(){const id=$('filter').value;if(!id){renderTable('roster',[]);renderTable('grades',[]);return}const [students,results]=await Promise.all([api('students?class_id='+encodeURIComponent(id)),api('submissions?class_id='+encodeURIComponent(id))]);submissions=results.submissions;renderTable('roster',students.students.map(x=>[x.student_id,x.name]));renderTable('grades',submissions.map(x=>[x.student_id,x.mission,x.seed,x.score,x.submitted]));}
function safe(fn){return async()=>{try{await fn()}catch(e){msg('操作失败：'+e.message)}}}
$('connect').onclick=safe(async()=>{token=$('token').value;await load()});$('refresh').onclick=safe(load);$('filter').onchange=safe(readClass);
$('newClass').onclick=safe(async()=>{const x=await api('classes','POST',{name:$('className').value});msg('班级创建成功。请将加入码发给学生：'+x.code);await load()});
$('addStudent').onclick=safe(async()=>{await api('students','POST',{class_id:$('whichClass').value,student_id:$('studentId').value,name:$('studentName').value});await readClass();msg('学生登记成功')});
$('export').onclick=()=>{const rows=[['学号','实验','种子','成绩','提交时间'],...submissions.map(x=>[x.student_id,x.mission,x.seed,x.score,x.submitted])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='AgriBot_Class_Results.csv';a.click();URL.revokeObjectURL(u)};
</script></body></html>
